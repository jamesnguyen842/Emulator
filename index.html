<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Tiếng Anh - Pokemon Emerald</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        /* Khung chứa game */
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script>
        // Cấu hình giả lập EmulatorJS
        window.EJS_player = '#game-container';
        window.EJS_core = 'gba'; // Khai báo hệ máy Game Boy Advance
        
        // ĐƯỜNG DẪN TỚI FILE ROM CỦA BẠN (Phải khớp chính xác tên file đã upload)
        window.EJS_gameUrl = 'ROM-Emerald-AowVN.gba'; 
        
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    </script>
    
    <!-- Tải lõi giả lập -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
